name: Build SecureFolderFS Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: windows-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui

      - name: Restore Dependencies
        run: dotnet restore SecureFolderFS.Public.slnx

      - name: Build and Publish Android App (Release)
        run: |
          dotnet publish src/Platforms/SecureFolderFS.Maui/SecureFolderFS.Maui.csproj -f net10.0-android -c Release --no-restore -p:SupportedOSPlatformVersion=21.0

      - name: Upload APK/AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureFolderFS-Android-Package
          path: |
            **/bin/Release/net10.0-android*/**/*.apk
            **/bin/Release/net10.0-android*/**/*.aab
          if-no-files-found: error
