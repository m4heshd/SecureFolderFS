name: Build SecureFolderFS Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Dependencies
        uses: "./.github/install_dependencies"
        with:
          dotnet-version: '10.0.102'
          run-uno-check: false

      - name: Restore Solution
        run: |
          msbuild SecureFolderFS.Public.slnx `
            -maxcpucount `
            -t:Restore `
            -p:Platform="Any CPU" `
            -p:Configuration=Release

      - name: Build Android App (Release)
        run: |
          msbuild src\Platforms\SecureFolderFS.Maui\SecureFolderFS.Maui.csproj `
            -maxcpucount `
            -t:Build `
            -p:Platform="Any CPU" `
            -p:Configuration=Release `
            -p:TargetFramework=net10.0-android

      - name: List Build Output (Debug)
        run: tree /F /A

      - name: Upload APK/AAB Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SecureFolderFS-Android-Package
          path: |
            src/Platforms/SecureFolderFS.Maui/bin/Any CPU/Release/net10.0-android/*.aab
            src/Platforms/SecureFolderFS.Maui/bin/Any CPU/Release/net10.0-android/*.apks
          if-no-files-found: error