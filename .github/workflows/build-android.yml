name: Build SecureFolderFS Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        uses: "./.github/install_dependencies"
        with:
          dotnet-version: '10.0.102'
          run-uno-check: false

      - name: Restore Solution
        run: |
          dotnet restore SecureFolderFS.Public.slnx

      - name: Build Android App (Release)
        run: |
          dotnet build src\Platforms\SecureFolderFS.Maui\SecureFolderFS.Maui.csproj `
            -maxcpucount `
            -c Release `
            -p:TargetFramework=net10.0-android `
            -p:TargetPlatformVersion=36 `
            -p:SupportedOSPlatformVersion=23.0

      - name: Upload APK/AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureFolderFS-Android-Package
          path: |
            **/bin/Release/net10.0-android*/**/*.apk
            **/bin/Release/net10.0-android*/**/*.aab
          if-no-files-found: error