name: Build SecureFolderFS Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.102'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui

      - name: Restore Solution
        run: |
          msbuild SecureFolderFS.Public.slnx -t:Restore -p:Platform="Any CPU" -p:Configuration=Release

      - name: Build Android App (Release)
        run: |
          msbuild src\Platforms\SecureFolderFS.Maui\SecureFolderFS.Maui.csproj `
            -maxcpucount `
            -t:Build `
            -p:Platform="Any CPU" `
            -p:Configuration=Release `
            -p:TargetFramework=net10.0-android `
            -p:TargetPlatformVersion=36 `
            -p:SupportedOSPlatformVersion=23.0

      - name: Upload APK/AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureFolderFS-Android-Package
          path: |
            **/bin/Release/net10.0-android*/**/*.apk
            **/bin/Release/net10.0-android*/**/*.aab
          if-no-files-found: error